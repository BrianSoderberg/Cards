function updateDealFields() {
  const to = $('#dealTo').value;
  $$('.tableOnly').forEach(el => el.hidden = to === 'hand');
  $$('.gridOnly').forEach(el => el.hidden = to !== 'grid');
  $$('.countOnly').forEach(el => el.hidden = to === 'grid');
  $('#dealAllBtn').hidden = to === 'grid' || to === 'table';
  $('#dealCount').title = to === 'table' ? 'Cards in total' : 'Cards to each player';
  const c = clampInt($('#dealCols').value, 1, 8, 2), r = clampInt($('#dealRows').value, 1, 8, 2);
  $('#gridCalc').textContent = `= ${c * r} each`;
}
['#dealTo', '#dealCols', '#dealRows'].forEach(s => $(s).addEventListener('input', updateDealFields));
updateDealFields();

function getName() {
  const n = $('#name').value.trim().slice(0, 20);
  if (!n) { lobbyMsg('Enter your name first'); $('#name').focus(); return null; }
  try { localStorage.setItem('ct-name', n); } catch (e) {}
  myName = n; return n;
}
async function copyLink() {
  const url = location.href.split('#')[0] + '#' + joinCode;
  try { await navigator.clipboard.writeText(url); toast('Invite link copied'); }
  catch (e) { prompt('Copy this link:', url); }
}

/* ---------- full screen ----------
   Browsers only allow full screen from a tap, so phones and tablets switch to it when you
   press Create or Join; the ⛶ button toggles it. iPhones don't let web pages go full screen,
   but adding the game to the Home Screen opens it without the browser bars. */
const isTouch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const docEl = document.documentElement;
const canFullscreen = !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen);
const isInstalled = !!((window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches) || navigator.standalone);
const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function goFullscreen() {
  if (isInstalled || !canFullscreen || isFullscreen()) return;
  try {
    const p = (docEl.requestFullscreen || docEl.webkitRequestFullscreen).call(docEl, {navigationUI: 'hide'});
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function toggleFullscreen() {
  if (isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else goFullscreen();
}
$('#fsBtn').hidden = isInstalled || !canFullscreen;
$('#fsBtn').onclick = toggleFullscreen;
const onFsChange = () => { $('#fsBtn').title = isFullscreen() ? 'Exit full screen' : 'Full screen'; };
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
if (isTouch && !isInstalled && !canFullscreen) {
  $('#installTip').hidden = false;
  $('#installTip').textContent = 'For full screen on iPhone: tap the Share button, then “Add to Home Screen”, and open Card Table from there.';
}

$('#createBtn').onclick = () => {
  const n = getName(); if (!n) return;
  if (isTouch) goFullscreen();
  const t = $('#tableName').value.trim().slice(0, 40);
  try { localStorage.setItem('ct-table', t); } catch (e) {}
  createRoom(n, t);
};
$('#joinBtn').onclick = () => {
  const n = getName(); if (!n) return;
  const c = $('#code').value.trim().toUpperCase();
  if (!c) { lobbyMsg('Enter a room code or pick a table'); return; }
  if (isTouch) goFullscreen();
  joinRoom(n, c);
};
$('#tablesList').addEventListener('click', e => {
  const b = e.target.closest('.joinrow'); if (!b) return;
  const n = getName(); if (!n) return;
  if (isTouch) goFullscreen();
  joinRoom(n, b.dataset.code);
});
$('#refreshTablesBtn').onclick = refreshTables;
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') $('#joinBtn').click(); });
$('#tableName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#createBtn').click(); });
$('#reconnectBtn').onclick = () => joinRoom(myName, joinCode);

// One listener for every tappable thing in the game
$('#game').addEventListener('click', e => {
  if (suppressClick || e.target.closest('#seats')) return;   // after a drag; seat chips use pointer events
  const a = e.target.closest('[data-act]');
  if (a) { flushPendingTap(); onAct(a.dataset.act, a.dataset); return; }
  const z = e.target.closest('[data-zone]');
  if (z) handleTap(z.dataset.zone, {...z.dataset});
});
// A long-press on a card shouldn't pop up the browser's menu.
$('#game').addEventListener('contextmenu', e => { if (e.target.closest('.card, [data-zone]')) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#editDlg').hidden) closeEdit();
    else if (dealOpen) { dealOpen = false; render(); }
    else if (sel) { sel = null; render(); }
  }
});

$('#takeTrickBtn').onclick = () => act({type: 'takeTrick'});
$('#doneBtn').onclick = () => act({type: 'done'});
$('#dealerSel').onchange = e => act({type: 'setDealer', playerId: e.target.value});
$('#randomDealerBtn').onclick = () => act({type: 'randomDealer'});

$('#applyDeckBtn').onclick = () => act({type: 'setupDeck', decks: parseInt($('#decksSel').value, 10), jokers: $('#jokersChk').checked});
$('#teamsChk').onchange = e => {
  act({type: 'scoreMode', teams: e.target.checked});
  if (e.target.checked) toast('Players were put on teams by seat (1st & 3rd, 2nd & 4th). Change them below.');
};
$('#turnsChk').onchange = e => act({type: 'turnsOn', on: e.target.checked});
$('#keepFaceChk').onchange = e => act({type: 'keepFace', on: e.target.checked});
$('#teamAssign').addEventListener('change', e => {
  const s = e.target.closest('select[data-assign]');
  if (s) act({type: 'setTeam', playerId: s.dataset.assign, teamId: s.value});
});
$('#resetScoresBtn').onclick = () => { if (confirm('Set every score back to 0?')) act({type: 'resetScores'}); };
const dealParams = () => ({
  type: 'deal',
  to: $('#dealTo').value,
  faceUp: $('#dealFace').value === 'up',
  cols: $('#dealCols').value,
  rows: $('#dealRows').value,
  count: $('#dealCount').value
});
// Dealing closes the panel; the Deal ▾ button toggles it.
$('#dealBtn').onclick = () => { dealOpen = false; act(dealParams()); render(); };
$('#dealAllBtn').onclick = () => { dealOpen = false; act({...dealParams(), all: true}); render(); };
$('#dealToggle').onclick = () => { dealOpen = !dealOpen; render(); };
$('#dealCloseBtn').onclick = () => { dealOpen = false; render(); };
$('#shuffleBtn').onclick = () => act({type: 'shuffle'});
$('#reshuffleDiscardBtn').onclick = () => act({type: 'reshuffleDiscard'});
$('#collectBtn').onclick = () => { if (confirm('Collect every card from every player and reshuffle?')) act({type: 'collect'}); };
$('#passDealSel').onchange = e => {
  const to = e.target.value; if (!to) return;
  dealOpen = false;
  act({type: 'passDeal', to});
};

// Edit dialog
$('#editForm').addEventListener('submit', e => {
  e.preventDefault();
  const cb = editCb, v = $('#editInput').value;
  closeEdit();
  if (cb) cb(v);
});
$('#editCancel').onclick = closeEdit;
$('#editDlg').addEventListener('click', e => { if (e.target.id === 'editDlg') closeEdit(); });

// Chat
$('#chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const t = $('#chatInput').value.trim();
  if (!t) return;
  act({type: 'chat', text: t});
  $('#chatInput').value = '';
});
$('#chatToggle').onclick = () => {
  const open = $('#chatDock').classList.toggle('open');
  $('#chatToggle').textContent = open ? '▾' : '▴';
  $('#chatToggle').title = open ? 'Show less chat' : 'Show more chat';
  const box = $('#chatMsgs'); box.scrollTop = box.scrollHeight;
};

// If the host closes the tab, the game ends for everyone — warn first.
window.addEventListener('beforeunload', e => { if (isHost && inGame) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- startup ---------- */
try {
  $('#name').value = localStorage.getItem('ct-name') || '';
  $('#tableName').value = localStorage.getItem('ct-table') || '';
} catch (e) {}
// An invite link (or a refresh after playing) carries a room code in the address. Don't force it
// into a Join box (the table may be gone); highlight it in the open-tables list if it's there,
// and tuck it into "Have a room code?" in case the list can't be reached.
const hashCode = location.hash.replace('#', '').trim().toUpperCase().slice(0, 5);
if (hashCode) { invitedCode = hashCode; $('#code').value = hashCode; }
try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
if (typeof Peer === 'undefined') {
  setLobbyBusy(true);
  lobbyMsg('Could not load the networking library. Check your connection and reload.');
} else {
  startBrowse();
}
</script>
</body>
</html>
